            const emeraldLight = new THREE.PointLight(0x10b981, 2.5, 30);
            emeraldLight.position.set(-5, -4, 4);
            bgScene.add(emeraldLight);

            // 3D Core Group
            bgCoreGroup = new THREE.Group();

            // Holographic Torus Ring 1
            const ringGeo1 = new THREE.TorusGeometry(3.2, 0.015, 16, 120);
            const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
            const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
            ring1.rotation.x = Math.PI / 2.3;
            bgCoreGroup.add(ring1);

            // Holographic Torus Ring 2
            const ringGeo2 = new THREE.TorusGeometry(3.6, 0.012, 16, 120);
            const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.28 });
            const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
            ring2.rotation.x = -Math.PI / 3;
            ring2.rotation.y = Math.PI / 6;
            bgCoreGroup.add(ring2);

            // Central Glowing Holographic Octahedron Core
            const coreGeo = new THREE.OctahedronGeometry(0.9, 2);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                emissive: 0x0284c7,
                emissiveIntensity: 0.75,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            bgCoreGroup.add(coreMesh);

            bgScene.add(bgCoreGroup);

            // Floating 3D Binary Data Particle Field
            const pCount = 140;
            const pPos = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount * 3; i += 3) {
                pPos[i] = (Math.random() - 0.5) * 14;
                pPos[i + 1] = (Math.random() - 0.5) * 12;
                pPos[i + 2] = (Math.random() - 0.5) * 6;
            }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 0.055,
                transparent: true,
                opacity: 0.65
            });
            bgParticles = new THREE.Points(pGeo, pMat);
            bgScene.add(bgParticles);

            // Subtle Parallax tracking without blocking touches
            window.addEventListener("mousemove", (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 0.6;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 0.6;
            }, { passive: true });

            window.addEventListener("resize", () => {
                if (!bgRenderer || !bgCamera) return;
                bgCamera.aspect = window.innerWidth / window.innerHeight;
                bgCamera.updateProjectionMatrix();
                bgRenderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate3DAmbient();
        }

        function animate3DAmbient() {
            requestAnimationFrame(animate3DAmbient);
            const t = Date.now() * 0.0008;

            if (bgCoreGroup) {
                bgCoreGroup.rotation.y = t * 0.35 + mouseX;
                bgCoreGroup.rotation.x = Math.sin(t * 0.5) * 0.18 + mouseY;
                bgCoreGroup.position.y = Math.sin(t * 1.2) * 0.2;
            }
            if (bgParticles) {
                bgParticles.rotation.y = t * 0.12;
            }
            if (bgRenderer && bgScene && bgCamera) {
                bgRenderer.render(bgScene, bgCamera);
            }
        }

        function saveFlashFile(e) {
            e.preventDefault();
            const idVal = document.getElementById("editFileId").value;
            const fileData = {
                id: idVal ? parseInt(idVal) : Date.now(),
                name: document.getElementById("editFileName").value.trim(),
                brand: document.getElementById("editFileBrand").value,
                category: document.getElementById("editFileCategory").value,
                cpu: document.getElementById("editFileCpu").value,
                chipsetDetail: document.getElementById("editFileChipDetail").value.trim(),
                size: document.getElementById("editFileSize").value.trim(),
                access: document.getElementById("editFileAccess").value,
                password: document.getElementById("editFilePassword").value,
                zipPassword: document.getElementById("editFileZipPassword").value.trim() || `GSMRM-${Math.floor(1000 + Math.random() * 9000)}`,
                downloadUrl: document.getElementById("editFileDownloadUrl").value.trim(),
                desc: document.getElementById("editFileDesc").value.trim(),
                readLog: document.getElementById("editFileReadLog").value.trim(),
                date: new Date().toISOString().split("T")[0],
                downloads: idVal ? (FLASH_FILES.find(f => f.id === parseInt(idVal))?.downloads || 0) : 0
            };

            if (idVal) {
                const idx = FLASH_FILES.findIndex(f => f.id === parseInt(idVal));
                if (idx !== -1) FLASH_FILES[idx] = fileData;
            } else {
                FLASH_FILES.unshift(fileData);
            }

            localStorage.setItem("gsm_admin_files", JSON.stringify(FLASH_FILES));
            closeModal("fileEditorModal");
            renderAdminFilesTable();
            renderAdminOverview();
            renderFiles();
            renderTickers();
            triggerDynamicIsland("File Saved Successfully", `${fileData.name} updated with pass: ${fileData.zipPassword}`, "SAVED");
        }

        function deleteFlashFile(fileId) {
            const f = FLASH_FILES.find(item => item.id === fileId);
            if (!f) return;
            if (confirm(`Are you sure you want to delete "${f.name}"?`)) {
                FLASH_FILES = FLASH_FILES.filter(item => item.id !== fileId);
                localStorage.setItem("gsm_admin_files", JSON.stringify(FLASH_FILES));
                renderAdminFilesTable();
                renderAdminOverview();
                renderFiles();
                renderTickers();
                triggerDynamicIsland("File Removed", `${f.name} deleted`, "DEL");
            }
        }

        }
        function updateRequestStatus(idx, status) {
            if (CUSTOMER_REQUESTS[idx]) {
                CUSTOMER_REQUESTS[idx].status = status;
                localStorage.setItem("gsm_customer_requests", JSON.stringify(CUSTOMER_REQUESTS));
                renderAdminOrders();
            }
        }
        function deleteRequest(idx) {
            CUSTOMER_REQUESTS.splice(idx, 1);
            localStorage.setItem("gsm_customer_requests", JSON.stringify(CUSTOMER_REQUESTS));
            renderAdminOrders();
        }
        function clearAllOrders() {
            if (confirm("Clear all orders and requests history?")) {
                CUSTOMER_ORDERS = []; CUSTOMER_REQUESTS = [];
                localStorage.setItem("gsm_customer_orders", "[]");
                localStorage.setItem("gsm_customer_requests", "[]");
                renderAdminOrders(); renderAdminOverview();
            }
        }

        // ==================== ADMIN SETTINGS & BACKUP ====================
        function renderAdminSettings() {
            document.getElementById("adminSetUser").value = ADMIN_SETTINGS.adminUser;
            document.getElementById("adminSetPass").value = ADMIN_SETTINGS.adminPass;
        }

        function saveAdminCredentials(e) {
            e.preventDefault();
            ADMIN_SETTINGS.adminUser = document.getElementById("adminSetUser").value.trim();
            ADMIN_SETTINGS.adminPass = document.getElementById("adminSetPass").value.trim();
            localStorage.setItem("gsm_admin_settings", JSON.stringify(ADMIN_SETTINGS));
            triggerDynamicIsland("Security Updated", "Admin username & password changed!", "KEY");
        }

        function exportSiteData() {
            const data = {
                portal: "GSMRM.BD",
                exportedAt: new Date().toISOString(),
                brands: BRANDS,
                files: FLASH_FILES,
                packages: PACKAGES,
                payments: PAYMENT_SETTINGS,
                settings: ADMIN_SETTINGS,
                orders: CUSTOMER_ORDERS,
                requests: CUSTOMER_REQUESTS
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `gsmrm_bd_backup_${new Date().toISOString().split("T")[0]}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            triggerDynamicIsland("Backup Downloaded", "All site data exported as JSON", "BACKUP");
        }

        function importSiteData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed.brands) { BRANDS = parsed.brands; localStorage.setItem("gsm_admin_brands", JSON.stringify(BRANDS)); }
                    if (parsed.files) { FLASH_FILES = parsed.files; localStorage.setItem("gsm_admin_files", JSON.stringify(FLASH_FILES)); }
                    if (parsed.packages) { PACKAGES = parsed.packages; localStorage.setItem("gsm_admin_packages", JSON.stringify(PACKAGES)); }
                    if (parsed.payments) { PAYMENT_SETTINGS = parsed.payments; localStorage.setItem("gsm_admin_payments", JSON.stringify(PAYMENT_SETTINGS)); }
                    if (parsed.settings) { ADMIN_SETTINGS = parsed.settings; localStorage.setItem("gsm_admin_settings", JSON.stringify(ADMIN_SETTINGS)); }
                    if (parsed.orders) { CUSTOMER_ORDERS = parsed.orders; localStorage.setItem("gsm_customer_orders", JSON.stringify(CUSTOMER_ORDERS)); }
                    if (parsed.requests) { CUSTOMER_REQUESTS = parsed.requests; localStorage.setItem("gsm_customer_requests", JSON.stringify(CUSTOMER_REQUESTS)); }

                    applyPaymentSettings();
                    renderBrands(); renderFiles(); renderTickers(); renderPackages();
                    refreshAllAdminViews();
                    triggerDynamicIsland("Backup Restored", "All website data successfully imported!", "RESTORE");
                } catch(err) {
                    alert("Invalid JSON backup file format!");
                }
            };
            reader.readAsText(file);
        }

        function resetSiteDefaults() {
            if (confirm("Reset everything to factory defaults? All custom changes will be reset.")) {
                localStorage.removeItem("gsm_admin_brands");
                localStorage.removeItem("gsm_admin_files");
                localStorage.removeItem("gsm_admin_packages");
                localStorage.removeItem("gsm_admin_payments");
                localStorage.removeItem("gsm_admin_settings");
                localStorage.removeItem("gsm_customer_orders");
                localStorage.removeItem("gsm_customer_requests");
                location.reload();
            }
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeIslandMenu();
                ["fileModal", "requestModal", "checkoutModal", "dashboardModal", "authModal", "adminLoginModal", "fileEditorModal", "brandEditorModal"].forEach(closeModal);
            }
            // Secret Shortcut: Ctrl + Shift + A
            if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")) {
                e.preventDefault();
                openAdminLogin();
            }
        });
    </script>

</body>
</html>
